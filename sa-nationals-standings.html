<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA National ROK Karting Championship 2026 — Standings</title>
  <link rel="icon" href="/icons/icon-192x192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1e40af;
      --ink:       #dbeafe;
      --ink-dim:   rgba(219,234,254,0.65);
      --ink-faint: rgba(219,234,254,0.3);
      --white:     #ffffff;
      --gold:      #facc15;
      --p1:        #facc15;
      --p2:        rgba(219,234,254,0.85);
      --p3:        #93c5fd;
      --border:    rgba(219,234,254,0.15);
      --border-bright: rgba(219,234,254,0.4);
    }

    html, body { height: 100%; overscroll-behavior-y: none; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* HERO */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      padding: clamp(40px,8vw,80px) 24px clamp(28px,5vw,48px);
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(250,204,21,0.07) 0%, transparent 55%);
      pointer-events: none;
    }
    .kicker {
      font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--ink-dim); margin-bottom: 1rem;
      opacity: 0; transform: translateY(6px);
      animation: fadeUp 0.6s ease-out 0.04s forwards;
    }
    .title {
      font-size: clamp(2rem, 6vw, 4.2rem); font-weight: 700;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--white); line-height: 1; margin-bottom: 1.2rem;
      opacity: 0; transform: translateY(18px);
      animation: fadeUp 0.9s ease-out 0.12s forwards;
    }
    .subtitle {
      font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-dim);
      opacity: 0; animation: fadeUp 0.9s ease-out 0.22s forwards;
    }
    .divider {
      width: 48px; height: 2px; background: var(--gold);
      margin: 1.6rem auto 0;
      opacity: 0; animation: fadeUp 0.6s ease-out 0.3s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* TABS */
    .tab-wrap { display: flex; justify-content: center; padding: 0 16px 32px; }
    .tab-bar {
      display: flex; gap: 0;
      background: rgba(15,23,42,0.3);
      border: 1px solid var(--border);
      overflow: hidden; flex-wrap: wrap;
    }
    .class-tab {
      padding: 10px 24px; border: none; background: transparent;
      color: var(--ink-dim); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
      transition: all 0.18s; border-right: 1px solid var(--border); white-space: nowrap;
    }
    .class-tab:last-child { border-right: none; }
    .class-tab:hover { color: var(--white); background: rgba(255,255,255,0.06); }
    .class-tab.active { background: rgba(15,23,42,0.55); color: var(--white); box-shadow: inset 0 -2px 0 var(--gold); }

    /* PANEL */
    .panel-wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 80px; }

    /* PODIUM */
    .podium-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 24px; }
    .podium-card {
      background: rgba(15,23,42,0.4); border: 1px solid var(--border);
      padding: 20px 16px 16px; text-align: center; position: relative; transition: border-color 0.2s;
    }
    .podium-card:hover { border-color: var(--border-bright); }
    .podium-card.p1 { border-color: rgba(250,204,21,0.5); }
    .podium-card.p2 { border-color: rgba(219,234,254,0.3); }
    .podium-card.p3 { border-color: rgba(147,197,253,0.3); }
    .podium-card.p1::before, .podium-card.p2::before, .podium-card.p3::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    }
    .podium-card.p1::before { background: var(--gold); }
    .podium-card.p2::before { background: rgba(219,234,254,0.6); }
    .podium-card.p3::before { background: #93c5fd; }
    .podium-pos { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 6px; }
    .p1 .podium-pos { color: var(--gold); }
    .p2 .podium-pos { color: var(--p2); }
    .p3 .podium-pos { color: var(--p3); }
    .podium-name {
      font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--white); line-height: 1.3; margin-bottom: 10px;
    }
    .podium-pts { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
    .p1 .podium-pts { color: var(--gold); }
    .p2 .podium-pts { color: var(--p2); }
    .p3 .podium-pts { color: var(--p3); }
    .podium-pts-label { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); margin-top: 2px; }
    .podium-raceno { position: absolute; top: 10px; right: 12px; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--ink-faint); font-weight: 600; }
    .podium-team { margin-top: 8px; font-size: 0.68rem; letter-spacing: 0.1em; color: var(--ink-dim); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* TABLE */
    .tbl-wrap { border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: rgba(15,23,42,0.55); border-bottom: 1px solid var(--border-bright); }
    th { padding: 12px 16px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); text-align: left; }
    th.c { text-align: center; }
    tbody tr { border-bottom: 1px solid rgba(219,234,254,0.06); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody tr.r1 { background: rgba(250,204,21,0.05); }
    tbody tr.r2 { background: rgba(219,234,254,0.03); }
    tbody tr.r3 { background: rgba(147,197,253,0.04); }
    td { padding: 14px 16px; font-size: 0.82rem; color: var(--ink); }
    td.c { text-align: center; }
    .rank-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; font-size: 0.78rem; font-weight: 800; border: 1px solid var(--border); color: var(--ink-dim); background: rgba(15,23,42,0.3); }
    .r1 .rank-num { border-color: rgba(250,204,21,0.6); color: var(--gold); background: rgba(250,204,21,0.08); }
    .r2 .rank-num { border-color: rgba(219,234,254,0.4); color: var(--p2); background: rgba(219,234,254,0.05); }
    .r3 .rank-num { border-color: rgba(147,197,253,0.4); color: var(--p3); background: rgba(147,197,253,0.06); }
    .driver-name { font-size: 0.84rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--white); }
    .driver-team { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--ink-dim); margin-top: 2px; font-style: italic; }
    .race-no { display: inline-block; padding: 2px 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; border: 1px solid var(--border); color: var(--ink-dim); background: rgba(15,23,42,0.3); }
    .pts-val { font-size: 1.05rem; font-weight: 800; color: var(--white); }
    .r1 .pts-val { color: var(--gold); }
    .r2 .pts-val { color: var(--p2); }
    .r3 .pts-val { color: var(--p3); }
    .rds-val { font-size: 0.7rem; letter-spacing: 0.12em; color: var(--ink-dim); }

    /* SECTION LABEL */
    .section-label { font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* SKELETON */
    @keyframes pulse { 0%,100%{opacity:0.25} 50%{opacity:0.5} }
    .skel { background: rgba(219,234,254,0.15); animation: pulse 1.6s ease-in-out infinite; }

    /* BACK */
    .back {
      position: fixed; top: 16px; left: 20px; font-size: 0.65rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-dim); text-decoration: none;
      display: flex; align-items: center; gap: 6px; z-index: 10; transition: color 0.15s;
    }
    .back:hover { color: var(--white); }

    /* META BAR */
    .meta-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 16px; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 5px #4ade80; animation: blink 2s ease-in-out infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 20px; color: var(--ink-dim); }
    .empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.3; }
    .empty-title { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px; }
    .empty-sub { font-size: 0.78rem; letter-spacing: 0.06em; }

    /* RESPONSIVE */
    @media (max-width: 560px) {
      .podium-row { grid-template-columns: 1fr; gap: 8px; }
      .class-tab { padding: 10px 14px; font-size: 0.65rem; letter-spacing: 0.12em; }
      .title { letter-spacing: 0.15em; }
    }
    @media (max-width: 400px) { .back { display: none; } }
  </style>
</head>
<body>
  <a href="/" class="back">&#8592; Home</a>
  <div class="hero">
    <div class="kicker">ROK Cup South Africa &middot; 2026</div>
    <div class="title">National Championship</div>
    <div class="subtitle">Official Standings &middot; 2026 Season</div>
    <div class="divider"></div>
  </div>
  <div class="tab-wrap">
    <div class="tab-bar" id="classTabs">
      <button class="class-tab active" data-class="CADET">Cadet ROK</button>
      <button class="class-tab" data-class="MINI ROK">Mini ROK</button>
      <button class="class-tab" data-class="OK-J">OK Junior</button>
      <button class="class-tab" data-class="OK-N">OK National</button>
    </div>
  </div>
  <div class="panel-wrap">
    <div id="standingsContent"></div>
  </div>
  <script>
    const SEASON='2026', CHAMP='ROK NATS';
    const CLASS_LABELS={'CADET':'Cadet ROK','MINI ROK':'Mini ROK','OK-J':'OK Junior','OK-N':'OK National'};
    let currentClass='CADET';
    const cache={};
    function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function ordinal(n){const v=n%100;return n+((v>=11&&v<=13)?'th':['th','st','nd','rd'][n%10]||'th');}
    document.getElementById('classTabs').addEventListener('click',e=>{
      const btn=e.target.closest('.class-tab');if(!btn)return;
      document.querySelectorAll('.class-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); currentClass=btn.dataset.class; loadStandings(currentClass);
    });
    function showSkeleton(){
      const c=document.getElementById('standingsContent');
      c.innerHTML='<div class="podium-row" style="margin-bottom:20px;">'
        +[1,2,3].map(()=>'<div class="skel" style="height:140px;"></div>').join('')
        +'</div><div class="tbl-wrap"><div class="skel" style="height:48px;margin-bottom:1px;"></div>'
        +Array(8).fill('<div class="skel" style="height:52px;margin-bottom:1px;"></div>').join('')
        +'</div>';
    }
    function renderStandings(standings,raceClass){
      const c=document.getElementById('standingsContent');
      const label=CLASS_LABELS[raceClass]||raceClass;
      const now=new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
      if(!standings||standings.length===0){
        c.innerHTML='<div class="empty"><div class="empty-icon">&#127937;</div><div class="empty-title">No results yet</div><div class="empty-sub">Data will appear once rounds are complete</div></div>';
        return;
      }
      standings.sort((a,b)=>parseFloat(b.total_points)-parseFloat(a.total_points)||parseFloat(b.races_completed)-parseFloat(a.races_completed));
      const pCls=['p1','p2','p3'];
      const podium=standings.slice(0,3).map((s,i)=>{
        const name=esc((s.first_name||'')+' '+(s.last_name||'')).trim();
        const pts=Math.round(parseFloat(s.total_points||0));
        return '<div class="podium-card '+pCls[i]+'">'
          +'<span class="podium-raceno">#'+esc(s.race_number||'')+'</span>'
          +'<div class="podium-pos">'+ordinal(i+1)+' place</div>'
          +'<div class="podium-name">'+name+'</div>'
          +'<div class="podium-pts">'+pts+'</div>'
          +'<div class="podium-pts-label">points</div>'
          +(s.team_name?'<div class="podium-team">'+esc(s.team_name)+'</div>':'')
          +'</div>';
      }).join('');
      const rows=standings.map((s,i)=>{
        const rank=i+1,rc=rank<=3?'r'+rank:'';
        const name=esc((s.first_name||'')+' '+(s.last_name||'')).trim();
        const pts=Math.round(parseFloat(s.total_points||0));
        const rds=parseInt(s.races_completed||0);
        return '<tr class="'+rc+'">'
          +'<td class="c" style="width:52px;"><div class="rank-num">'+rank+'</div></td>'
          +'<td><div class="driver-name">'+name+'</div>'+(s.team_name?'<div class="driver-team">'+esc(s.team_name)+'</div>':'')+'</td>'
          +'<td class="c"><span class="race-no">'+esc(s.race_number||'')+'</span></td>'
          +'<td class="c"><span class="rds-val">'+rds+' rd'+(rds!==1?'s':'')+'</span></td>'
          +'<td class="c"><span class="pts-val">'+pts+'</span></td>'
          +'</tr>';
      }).join('');
      c.innerHTML='<div class="meta-bar"><span class="live-dot"></span>'+esc(label)+' &middot; '+standings.length+' drivers &middot; updated '+now+'</div>'
        +'<div class="section-label">'+esc(label)+' &mdash; ROK NATS 2026</div>'
        +'<div class="podium-row">'+podium+'</div>'
        +'<div class="tbl-wrap"><table><thead><tr>'
        +'<th class="c">Pos</th><th>Driver</th><th class="c">No.</th><th class="c">Rounds</th><th class="c">Points</th>'
        +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    async function loadStandings(raceClass){
      if(cache[raceClass]){renderStandings(cache[raceClass],raceClass);return;}
      showSkeleton();
      try{
        const resp=await fetch('/api/championship-standings/'+SEASON+'/'+encodeURIComponent(raceClass)+'?championship_type='+encodeURIComponent(CHAMP));
        if(!resp.ok)throw new Error('HTTP '+resp.status);
        const data=await resp.json();
        if(!data.success)throw new Error(data.error||'API error');
        cache[raceClass]=data.standings||[];
        renderStandings(cache[raceClass],raceClass);
      }catch(err){
        document.getElementById('standingsContent').innerHTML='<div class="empty"><div class="empty-icon">&#9888;&#65039;</div><div class="empty-title">Failed to load</div><div class="empty-sub">'+esc(err.message)+'</div></div>';
      }
    }
    loadStandings(currentClass);
  </script>
</body>
</html>
