<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIR Engine Inspection Portal</title>
    <style>
        :root {
            --accent:  #f97316;
            --accent2: #fb923c;
            --bg:      #000000;
            --panel-bg:#0a0a0a;
            --ink:     #ffffff;
            --muted:   #9ca3af;
            --border-soft:   rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.15);
            --shadow:        0 18px 40px rgba(0,0,0,0.30), 0 0 0 1px rgba(255,255,255,0.05);
            --shadow-strong: 0 30px 90px rgba(0,0,0,0.50), 0 0 0 1px rgba(255,255,255,0.08);
            --radius: 0px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui,-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
            background:#000;
            color:var(--ink);
            -webkit-font-smoothing:antialiased;
            padding:24px 18px;
            min-height:100vh;
        }
        @media(max-width:480px){ body{ padding:12px 10px; } }

        .container { max-width:600px; margin:0 auto; }

        /* ── Header ── */
        .header {
            background:#0f0f0f;
            border:1px solid var(--border-strong);
            box-shadow:var(--shadow-strong);
            padding:22px 22px 20px;
            text-align:center;
            margin-bottom:16px;
            position:relative;
            overflow:hidden;
        }
        .header::before {
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:linear-gradient(135deg,rgba(249,115,22,0.12) 0%,rgba(0,0,0,0.04) 55%,rgba(249,115,22,0.08) 100%);
        }
        .header-badge {
            display:inline-block;
            background:linear-gradient(135deg,#f97316,#ea580c);
            color:#fff;
            font-size:10px;
            font-weight:900;
            letter-spacing:0.15em;
            text-transform:uppercase;
            padding:3px 10px;
            margin-bottom:10px;
            position:relative;
            z-index:1;
        }
        .header h1 {
            font-size:20px;
            font-weight:900;
            letter-spacing:0.16em;
            text-transform:uppercase;
            color:var(--ink);
            position:relative;
            z-index:1;
        }
        .header p {
            font-size:11px;
            letter-spacing:0.12em;
            text-transform:uppercase;
            color:var(--muted);
            margin-top:8px;
            position:relative;
            z-index:1;
        }

        /* ── Cards ── */
        .card {
            background:#0f0f0f;
            border:1px solid var(--border-strong);
            box-shadow:var(--shadow-strong);
            padding:22px 22px 20px;
            margin-bottom:16px;
            position:relative;
            overflow:hidden;
        }
        .card > * { position:relative; z-index:1; }
        .card::before {
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:linear-gradient(135deg,rgba(255,255,255,0.18) 0%,rgba(0,0,0,0.04) 55%,rgba(255,255,255,0.12) 100%);
            opacity:0.20;
        }
        .card-title {
            font-size:13px;
            font-weight:900;
            letter-spacing:0.1em;
            text-transform:uppercase;
            color:var(--ink);
            margin-bottom:18px;
        }

        /* ── Stats grid ── */
        .stats-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:0;
        }
        .stat-box {
            background:#131313;
            border:1px solid var(--border-soft);
            padding:14px 12px;
            text-align:center;
        }
        .stat-num {
            font-size:28px;
            font-weight:900;
            letter-spacing:-0.02em;
            line-height:1;
            margin-bottom:4px;
        }
        .stat-label {
            font-size:10px;
            letter-spacing:0.1em;
            text-transform:uppercase;
            color:var(--muted);
            font-weight:700;
        }
        .col-red    { color:#ef4444; }
        .col-amber  { color:#f59e0b; }
        .col-blue   { color:#3b82f6; }
        .col-green  { color:#22c55e; }
        .col-orange { color:#f97316; }
        .col-muted  { color:var(--muted); }

        /* ── Buttons ── */
        .btn {
            width:100%;
            padding:14px;
            font-size:15px;
            font-weight:700;
            letter-spacing:0.05em;
            text-transform:uppercase;
            border:1px solid var(--border-soft);
            border-radius:var(--radius);
            margin-bottom:12px;
            cursor:pointer;
            transition:all 0.2s ease-out;
            box-shadow:var(--shadow);
            background:var(--panel-bg);
            color:var(--ink);
        }
        .btn:last-child { margin-bottom:0; }
        .btn:active { transform:scale(0.98); }
        .btn-primary   { background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff; border-color:#0ea5e9; }
        .btn-orange    { background:linear-gradient(135deg,#f97316,#ea580c); color:#fff; border-color:#f97316; }
        .btn-success   { background:linear-gradient(135deg,#4ade80,#22c55e); color:#fff; border-color:#4ade80; }
        .btn-warning   { background:linear-gradient(135deg,#facc15,#eab308); color:#0a0a0a; border-color:#facc15; font-weight:900; }
        .btn-secondary { background:#1a1a1a; color:var(--muted); border-color:var(--border-soft); }
        .btn-sm {
            width:auto;
            padding:8px 16px;
            font-size:12px;
            margin-bottom:0;
        }

        /* ── Inputs ── */
        .input-group { margin-bottom:16px; }
        .input-group label {
            display:block;
            font-size:11px;
            letter-spacing:0.05em;
            text-transform:uppercase;
            color:var(--muted);
            font-weight:700;
            margin-bottom:6px;
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            width:100%;
            padding:11px 12px;
            font-size:15px;
            border:1px solid rgba(255,255,255,0.12);
            border-radius:var(--radius);
            transition:border-color 0.2s;
            background:#0a0a0a;
            color:#fff;
            outline:none;
            font-family:inherit;
        }
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(249,115,22,0.12);
        }
        .input-group textarea { min-height:90px; resize:vertical; }
        .input-group select option { background:#1a1a1a; }
        .input-with-scan { position:relative; display:flex; gap:8px; }
        .input-with-scan input { flex:1; }
        .scan-btn {
            flex-shrink:0;
            width:44px;
            padding:0;
            font-size:20px;
            border:1px solid rgba(255,255,255,0.12);
            background:#1a1a1a;
            color:#fff;
            cursor:pointer;
            transition:background 0.2s;
        }
        .scan-btn:hover { background:#2a2a2a; }

        /* ── Outcome picker ── */
        .outcome-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:0;
        }
        .outcome-btn {
            padding:14px 10px;
            border:2px solid transparent;
            background:#131313;
            color:var(--muted);
            font-size:12px;
            font-weight:700;
            letter-spacing:0.06em;
            text-transform:uppercase;
            cursor:pointer;
            text-align:center;
            transition:all 0.15s;
            line-height:1.35;
        }
        .outcome-btn:hover { border-color:rgba(255,255,255,0.2); color:#fff; }
        .outcome-btn.selected-engine  { border-color:#ef4444; color:#ef4444; background:rgba(239,68,68,0.08); }
        .outcome-btn.selected-user    { border-color:#f59e0b; color:#f59e0b; background:rgba(245,158,11,0.08); }
        .outcome-btn.selected-mechanic{ border-color:#3b82f6; color:#3b82f6; background:rgba(59,130,246,0.08); }
        .outcome-btn.selected-incon   { border-color:#8b5cf6; color:#8b5cf6; background:rgba(139,92,246,0.08); }
        .outcome-btn.selected-no      { border-color:#22c55e; color:#22c55e; background:rgba(34,197,94,0.08); }

        /* ── Toggle ── */
        .toggle-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 14px;
            background:#131313;
            border:1px solid var(--border-soft);
            margin-bottom:14px;
            cursor:pointer;
        }
        .toggle-label { font-size:13px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); }
        .toggle-switch {
            width:44px;
            height:24px;
            background:#2a2a2a;
            border-radius:12px;
            border:1px solid var(--border-soft);
            position:relative;
            transition:background 0.2s;
        }
        .toggle-switch::after {
            content:"";
            width:18px;
            height:18px;
            border-radius:50%;
            background:#6b7280;
            position:absolute;
            top:2px;
            left:2px;
            transition:all 0.2s;
        }
        .toggle-switch.on { background:rgba(249,115,22,0.3); border-color:#f97316; }
        .toggle-switch.on::after { background:#f97316; left:22px; }

        /* ── Badges ── */
        .badge {
            display:inline-block;
            padding:3px 8px;
            font-size:10px;
            font-weight:900;
            letter-spacing:0.1em;
            text-transform:uppercase;
        }
        .badge-engine   { background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
        .badge-user     { background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
        .badge-mechanic { background:rgba(59,130,246,0.15); color:#3b82f6; border:1px solid rgba(59,130,246,0.3); }
        .badge-incon    { background:rgba(139,92,246,0.15); color:#8b5cf6; border:1px solid rgba(139,92,246,0.3); }
        .badge-no       { background:rgba(34,197,94,0.15);  color:#22c55e; border:1px solid rgba(34,197,94,0.3); }

        /* ── Log entry card ── */
        .log-entry {
            background:#0a0a0a;
            border:1px solid var(--border-soft);
            padding:14px 16px;
            margin-bottom:10px;
        }
        .log-entry:last-child { margin-bottom:0; }
        .log-header {
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:8px;
            margin-bottom:8px;
        }
        .log-name { font-size:15px; font-weight:700; flex:1; }
        .log-date { font-size:11px; color:var(--muted); white-space:nowrap; }
        .log-info {
            font-size:12px;
            color:var(--muted);
            margin-bottom:6px;
        }
        .log-info span { color:var(--ink); font-weight:600; }
        .log-notes {
            font-size:13px;
            color:#d1d5db;
            line-height:1.55;
            margin-top:6px;
            border-top:1px solid var(--border-soft);
            padding-top:8px;
        }
        .log-actions { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }
        .log-del {
            background:transparent;
            border:1px solid rgba(239,68,68,0.25);
            color:#ef4444;
            padding:4px 10px;
            font-size:11px;
            font-weight:700;
            letter-spacing:0.06em;
            text-transform:uppercase;
            cursor:pointer;
        }
        .log-del:hover { background:rgba(239,68,68,0.08); }

        /* ── Messages ── */
        .msg { padding:12px 14px; font-size:13px; font-weight:600; margin-bottom:14px; }
        .msg-success { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); color:#4ade80; }
        .msg-error   { background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.3);  color:#f87171; }

        /* ── Empty state ── */
        .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; }

        /* ── Camera overlay (reused from engine-management) ── */
        .camera-overlay {
            display:none;
            position:fixed;
            inset:0;
            background:#000;
            z-index:1000;
            flex-direction:column;
        }
        .camera-overlay.active { display:flex; }
        .camera-header {
            background:#0f0f0f;
            padding:14px 16px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border-bottom:1px solid var(--border-strong);
        }
        .camera-title { font-size:14px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
        .camera-close {
            background:transparent;
            border:none;
            color:#fff;
            font-size:26px;
            line-height:1;
            cursor:pointer;
            padding:2px 8px;
        }
        .camera-viewport { flex:1; position:relative; overflow:hidden; background:#000; }
        #scanner-reader  { width:100%; height:100%; }
        #scanner-reader video { width:100%; height:100%; object-fit:cover; }
        .camera-target {
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:72%;
            max-width:300px;
            height:300px;
            max-height:72vw;
            box-shadow:0 0 0 9999px rgba(0,0,0,0.55);
            pointer-events:none;
            z-index:2;
        }
        .camera-target::before,.camera-target::after {
            content:'';
            position:absolute;
            width:36px;
            height:36px;
            border:3px solid #f97316;
        }
        .camera-target::before { top:-3px; left:-3px; border-right:none; border-bottom:none; }
        .camera-target::after  { bottom:-3px; right:-3px; border-left:none; border-top:none; }
        .camera-target .corner-bl,.camera-target .corner-tr {
            position:absolute;
            width:36px;
            height:36px;
            border:3px solid #f97316;
        }
        .camera-target .corner-bl { bottom:-3px; left:-3px; border-right:none; border-top:none; }
        .camera-target .corner-tr { top:-3px; right:-3px; border-left:none; border-bottom:none; }
        .camera-scan-line {
            position:absolute;
            width:calc(100% - 12px);
            left:6px;
            height:2px;
            background:linear-gradient(90deg,transparent,#f97316,transparent);
            box-shadow:0 0 8px #f97316;
            animation:camScan 1.8s ease-in-out infinite;
        }
        @keyframes camScan { 0%,100%{ top:0; } 50%{ top:calc(100% - 2px); } }
        .camera-hint {
            position:absolute;
            bottom:36px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.8);
            padding:10px 18px;
            color:#fff;
            font-size:12px;
            font-weight:700;
            letter-spacing:0.05em;
            text-transform:uppercase;
            border:1px solid var(--border-soft);
            white-space:nowrap;
            z-index:3;
        }
        .camera-controls {
            background:#0f0f0f;
            padding:14px;
            display:flex;
            gap:10px;
            border-top:1px solid var(--border-strong);
        }
        .camera-ctrl {
            flex:1;
            padding:12px;
            background:#1a1a1a;
            border:1px solid var(--border-soft);
            color:#fff;
            font-size:12px;
            font-weight:700;
            letter-spacing:0.04em;
            text-transform:uppercase;
            cursor:pointer;
        }

        /* ── Tabs ── */
        .tab-bar { display:flex; gap:0; margin-bottom:16px; border:1px solid var(--border-strong); }
        .tab {
            flex:1;
            padding:11px 6px;
            background:#0a0a0a;
            border:none;
            color:var(--muted);
            font-size:11px;
            font-weight:700;
            letter-spacing:0.07em;
            text-transform:uppercase;
            cursor:pointer;
            border-right:1px solid var(--border-soft);
            transition:all 0.15s;
        }
        .tab:last-child { border-right:none; }
        .tab.active { background:#1a1a1a; color:var(--accent); }

        /* ── Search bar ── */
        .search-row { display:flex; gap:8px; margin-bottom:14px; }
        .search-row input {
            flex:1;
            padding:10px 12px;
            font-size:14px;
            border:1px solid var(--border-soft);
            background:#0a0a0a;
            color:#fff;
            outline:none;
            font-family:inherit;
        }
        .search-row input:focus { border-color:var(--accent); }
        .search-row select {
            padding:10px 8px;
            font-size:12px;
            border:1px solid var(--border-soft);
            background:#0a0a0a;
            color:#fff;
            outline:none;
            font-family:inherit;
            cursor:pointer;
        }

        .hidden { display:none !important; }
        .divider { height:1px; background:var(--border-soft); margin:16px 0; }
        .inline-label {
            font-size:11px;
            font-weight:700;
            letter-spacing:0.06em;
            text-transform:uppercase;
            color:var(--muted);
            margin-bottom:8px;
            display:block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

<!-- Camera Overlay -->
<div id="cameraOverlay" class="camera-overlay">
    <div class="camera-header">
        <div class="camera-title">Scan Barcode</div>
        <button class="camera-close" onclick="closeCamera()">×</button>
    </div>
    <div class="camera-viewport">
        <div id="scanner-reader"></div>
        <div class="camera-target">
            <div class="corner-bl"></div>
            <div class="corner-tr"></div>
            <div class="camera-scan-line"></div>
        </div>
        <div class="camera-hint">Hold steady in the box</div>
    </div>
    <div class="camera-controls">
        <button class="camera-ctrl" onclick="toggleFlash()"><span id="flashIcon">🔦</span> Flash</button>
        <button class="camera-ctrl" onclick="manualEntry()">⌨️ Manual</button>
    </div>
</div>

<div class="container">

    <div class="header">
        <div class="header-badge">Engine Inspection</div>
        <h1>DIR Portal</h1>
        <p>Engine Contact &amp; Issue Tracking</p>
    </div>

    <!-- ── DASHBOARD ── -->
    <div id="sectionDashboard">
        <!-- Stats -->
        <div class="card" id="statsCard" style="padding-bottom:16px;">
            <div class="card-title">📊 Overview — All Time</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num col-orange" id="statTotal">—</div>
                    <div class="stat-label">Total Contacts</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num col-red" id="statFaults">—</div>
                    <div class="stat-label">Engine Faults</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num col-amber" id="statUser">—</div>
                    <div class="stat-label">User Error</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num col-blue" id="statMechanic">—</div>
                    <div class="stat-label">Mechanic Error</div>
                </div>
            </div>
        </div>

        <!-- Nav -->
        <div class="card">
            <button class="btn btn-orange" onclick="showSection('log')">+ Log New Contact</button>
            <button class="btn btn-primary" onclick="showSection('logs')">📋 View All Logs</button>
            <button class="btn" style="background:#0f766e;color:#fff;" onclick="showSection('search')">🔍 Search by Engine Serial</button>
        </div>
    </div>

    <!-- ── LOG FORM ── -->
    <div id="sectionLog" class="hidden">
        <div class="card">
            <div class="card-title">Log Engine Contact</div>
            <div id="logMsg"></div>

            <div class="input-group">
                <label>Person's Name *</label>
                <input type="text" id="fPersonName" placeholder="Driver / mechanic / owner name">
            </div>

            <div class="input-group">
                <label>Engine Serial</label>
                <div class="input-with-scan">
                    <input type="text" id="fEngineSerial" placeholder="Scan or type serial" style="text-transform:uppercase;">
                    <button class="scan-btn" onclick="openCamera('fEngineSerial')" type="button">📷</button>
                </div>
            </div>

            <div class="input-group">
                <label>Date &amp; Time</label>
                <input type="datetime-local" id="fDate">
            </div>

            <div class="input-group">
                <label>Contact Type</label>
                <select id="fContactType">
                    <option value="Complaint">Complaint</option>
                    <option value="Inspection" selected>Inspection</option>
                    <option value="Post-Race Check">Post-Race Check</option>
                    <option value="Pre-Race Check">Pre-Race Check</option>
                    <option value="Service Request">Service Request</option>
                    <option value="Damage Report">Damage Report</option>
                    <option value="Warranty Query">Warranty Query</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="divider"></div>

            <span class="inline-label">Outcome / Finding *</span>
            <div class="outcome-grid" style="margin-bottom:16px;">
                <button class="outcome-btn" id="oBtnEngine"   onclick="selectOutcome('engine_fault')"  >🔴 Engine Fault</button>
                <button class="outcome-btn" id="oBtnUser"     onclick="selectOutcome('user_error')"    >🟡 User Error</button>
                <button class="outcome-btn" id="oBtnMechanic" onclick="selectOutcome('mechanic_error')">🔵 Mechanic Error</button>
                <button class="outcome-btn" id="oBtnIncon"    onclick="selectOutcome('inconclusive')"  >🟣 Inconclusive</button>
                <button class="outcome-btn" id="oBtnNo"       onclick="selectOutcome('no_fault')"      style="grid-column:1/-1;">✅ No Fault Found</button>
            </div>

            <!-- Fault category — shown only for engine_fault -->
            <div id="faultCategoryRow" class="input-group hidden">
                <label>Fault Category</label>
                <select id="fFaultCategory">
                    <option value="">— Select —</option>
                    <option value="Seized">Seized</option>
                    <option value="Power Loss">Power Loss</option>
                    <option value="Overheating">Overheating</option>
                    <option value="Fuel System">Fuel System</option>
                    <option value="Ignition">Ignition</option>
                    <option value="Carburetor">Carburetor</option>
                    <option value="Internal Damage">Internal Damage</option>
                    <option value="External Damage">External Damage</option>
                    <option value="Oil Leak">Oil Leak</option>
                    <option value="Starter">Starter Issue</option>
                    <option value="Exhaust">Exhaust</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Description of Problem</label>
                <textarea id="fDescription" placeholder="What did they report? What was observed?"></textarea>
            </div>

            <div class="input-group">
                <label>DIR Assessment / Notes</label>
                <textarea id="fNotes" placeholder="Your findings, root cause, action taken..."></textarea>
            </div>

            <div class="divider"></div>

            <div class="toggle-row" onclick="toggleFollowUp()">
                <span class="toggle-label">⚑ Follow-up Required</span>
                <div class="toggle-switch" id="followUpToggle"></div>
            </div>

            <div id="followUpRow" class="input-group hidden">
                <label>Follow-up Notes</label>
                <input type="text" id="fFollowUpNotes" placeholder="What needs to happen next?">
            </div>

            <button class="btn btn-orange" onclick="submitLog()">✔ Save Contact Log</button>
            <button class="btn btn-secondary" onclick="showSection('dashboard')">← Back</button>
        </div>
    </div>

    <!-- ── ALL LOGS ── -->
    <div id="sectionLogs" class="hidden">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <div class="card-title" style="margin-bottom:0;">All Contact Logs</div>
                <button class="btn btn-sm btn-secondary" onclick="loadLogs()">↻ Refresh</button>
            </div>
            <div class="search-row">
                <input type="text" id="logSearch" placeholder="Search name, engine, notes…" oninput="debounceSearch()">
                <select id="logFilter" onchange="loadLogs()">
                    <option value="">All</option>
                    <option value="engine_fault">Engine Fault</option>
                    <option value="user_error">User Error</option>
                    <option value="mechanic_error">Mechanic Error</option>
                    <option value="inconclusive">Inconclusive</option>
                    <option value="no_fault">No Fault</option>
                </select>
            </div>
            <div id="logsContainer"><div class="empty">Loading…</div></div>
            <button class="btn btn-secondary" onclick="showSection('dashboard')" style="margin-top:12px;">← Back</button>
        </div>
    </div>

    <!-- ── SEARCH BY ENGINE ── -->
    <div id="sectionSearch" class="hidden">
        <div class="card">
            <div class="card-title">Search by Engine Serial</div>
            <div class="input-group">
                <label>Engine Serial Number</label>
                <div class="input-with-scan">
                    <input type="text" id="searchSerial" placeholder="Type or scan engine serial" style="text-transform:uppercase;">
                    <button class="scan-btn" onclick="openCamera('searchSerial')" type="button">📷</button>
                </div>
            </div>
            <button class="btn btn-orange" onclick="searchByEngine()">Search Engine History</button>
            <button class="btn btn-secondary" onclick="showSection('dashboard')">← Back</button>
            <div id="engineSearchResults" class="hidden" style="margin-top:14px;">
                <div class="divider"></div>
                <div id="engineSearchContainer"></div>
            </div>
        </div>
    </div>

</div><!-- /container -->

<script>
// ── State ───────────────────────────────────────────────────────────────────
let selectedOutcome = null;
let followUpEnabled = false;
let cameraStream    = null;
let currentTargetInput = null;
let scanningActive  = false;
let flashEnabled    = false;
let searchDebounce  = null;

// ── Navigation ───────────────────────────────────────────────────────────────
function showSection(id) {
    ['sectionDashboard','sectionLog','sectionLogs','sectionSearch'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
    });
    document.getElementById('section' + id.charAt(0).toUpperCase() + id.slice(1)).classList.remove('hidden');
    if (id === 'log')       initLogForm();
    if (id === 'logs')      loadLogs();
    if (id === 'dashboard') loadStats();
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
    loadStats();
    // set datetime-local default to now
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('fDate').value =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
});

function initLogForm() {
    selectedOutcome = null;
    followUpEnabled = false;
    document.getElementById('fPersonName').value = '';
    document.getElementById('fEngineSerial').value = '';
    document.getElementById('fDescription').value = '';
    document.getElementById('fNotes').value = '';
    document.getElementById('fFollowUpNotes').value = '';
    document.getElementById('fFaultCategory').value = '';
    document.getElementById('fContactType').value = 'Inspection';
    document.getElementById('logMsg').innerHTML = '';
    document.getElementById('followUpToggle').className = 'toggle-switch';
    document.getElementById('followUpRow').classList.add('hidden');
    document.getElementById('faultCategoryRow').classList.add('hidden');
    ['oBtnEngine','oBtnUser','oBtnMechanic','oBtnIncon','oBtnNo'].forEach(id => {
        document.getElementById(id).className = 'outcome-btn';
    });
    // reset datetime to now
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('fDate').value =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

// ── Stats ──────────────────────────────────────────────────────────────────
async function loadStats() {
    try {
        const r = await fetch('/api/dir/logs?limit=1');
        const d = await r.json();
        if (d.success) {
            const s = d.stats;
            document.getElementById('statTotal').textContent    = s.total || 0;
            document.getElementById('statFaults').textContent   = s.engine_faults || 0;
            document.getElementById('statUser').textContent     = s.user_errors || 0;
            document.getElementById('statMechanic').textContent = s.mechanic_errors || 0;
        }
    } catch(e) { console.error(e); }
}

// ── Outcome picker ─────────────────────────────────────────────────────────
const OUTCOME_MAP = {
    engine_fault:   { btn:'oBtnEngine',   cls:'selected-engine'   },
    user_error:     { btn:'oBtnUser',     cls:'selected-user'     },
    mechanic_error: { btn:'oBtnMechanic', cls:'selected-mechanic' },
    inconclusive:   { btn:'oBtnIncon',    cls:'selected-incon'    },
    no_fault:       { btn:'oBtnNo',       cls:'selected-no'       },
};
function selectOutcome(val) {
    selectedOutcome = val;
    Object.values(OUTCOME_MAP).forEach(({ btn }) => {
        document.getElementById(btn).className = 'outcome-btn';
    });
    const m = OUTCOME_MAP[val];
    if (m) document.getElementById(m.btn).classList.add(m.cls);
    document.getElementById('faultCategoryRow').classList.toggle('hidden', val !== 'engine_fault');
}

// ── Follow-up toggle ───────────────────────────────────────────────────────
function toggleFollowUp() {
    followUpEnabled = !followUpEnabled;
    const sw = document.getElementById('followUpToggle');
    const row = document.getElementById('followUpRow');
    sw.className  = 'toggle-switch' + (followUpEnabled ? ' on' : '');
    row.classList.toggle('hidden', !followUpEnabled);
}

// ── Submit log ─────────────────────────────────────────────────────────────
async function submitLog() {
    const personName = document.getElementById('fPersonName').value.trim();
    if (!personName) { showLogMsg('Please enter the person\'s name.', 'error'); return; }
    if (!selectedOutcome) { showLogMsg('Please select an outcome / finding.', 'error'); return; }

    const payload = {
        engine_serial:   document.getElementById('fEngineSerial').value.trim() || null,
        person_name:     personName,
        contact_date:    document.getElementById('fDate').value || new Date().toISOString(),
        contact_type:    document.getElementById('fContactType').value,
        outcome:         selectedOutcome,
        fault_category:  selectedOutcome === 'engine_fault' ? document.getElementById('fFaultCategory').value : null,
        description:     document.getElementById('fDescription').value.trim() || null,
        dir_notes:       document.getElementById('fNotes').value.trim() || null,
        follow_up:       followUpEnabled,
        follow_up_notes: followUpEnabled ? document.getElementById('fFollowUpNotes').value.trim() : null,
    };

    try {
        const r = await fetch('/api/dir/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const d = await r.json();
        if (d.success) {
            showLogMsg('✔ Contact logged successfully.', 'success');
            loadStats();
            setTimeout(() => showSection('dashboard'), 1600);
        } else {
            showLogMsg(d.error || 'Failed to save.', 'error');
        }
    } catch(e) {
        showLogMsg('Network error: ' + e.message, 'error');
    }
}

function showLogMsg(msg, type) {
    document.getElementById('logMsg').innerHTML =
        `<div class="msg msg-${type}">${msg}</div>`;
    if (type === 'success') setTimeout(() => { document.getElementById('logMsg').innerHTML = ''; }, 4000);
}

// ── Load logs list ─────────────────────────────────────────────────────────
async function loadLogs() {
    const container = document.getElementById('logsContainer');
    container.innerHTML = '<div class="empty">Loading…</div>';

    const search  = document.getElementById('logSearch').value.trim();
    const outcome = document.getElementById('logFilter').value;

    const params = new URLSearchParams({ limit: 200 });
    if (search)  params.set('search', search);
    if (outcome) params.set('outcome', outcome);

    try {
        const r = await fetch('/api/dir/logs?' + params.toString());
        const d = await r.json();
        if (!d.success) { container.innerHTML = `<div class="empty">Error: ${d.error}</div>`; return; }
        if (!d.logs.length) { container.innerHTML = '<div class="empty">No contact logs found.</div>'; return; }
        container.innerHTML = d.logs.map(log => renderLogEntry(log)).join('');
    } catch(e) {
        container.innerHTML = `<div class="empty">Network error: ${e.message}</div>`;
    }
}

function debounceSearch() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadLogs, 400);
}

function renderLogEntry(log) {
    const date = new Date(log.contact_date).toLocaleString('en-ZA', { dateStyle:'short', timeStyle:'short' });
    const badge = outcomeBadge(log.outcome);
    const serial = log.engine_serial ? `<span>${log.engine_serial}</span>` : '<span style="color:#4b5563;">No serial</span>';
    const notes = (log.dir_notes || log.description)
        ? `<div class="log-notes">${escHtml(log.dir_notes || log.description)}</div>` : '';
    const followUp = log.follow_up
        ? `<span style="color:#f97316;font-size:11px;font-weight:700;">⚑ FOLLOW-UP</span>` : '';
    const faultCat = log.fault_category
        ? `<span style="color:var(--ink);font-weight:600;">${escHtml(log.fault_category)}</span> · ` : '';
    return `
    <div class="log-entry">
        <div class="log-header">
            <div class="log-name">${escHtml(log.person_name)}</div>
            <div class="log-date">${date}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            ${badge}
            ${followUp}
        </div>
        <div class="log-info">Engine: ${serial} &nbsp;·&nbsp; ${faultCat}<span>${escHtml(log.contact_type)}</span></div>
        ${notes}
        <div class="log-actions">
            <button class="log-del" onclick="deleteLog(${log.contact_id})">Delete</button>
        </div>
    </div>`;
}

async function deleteLog(id) {
    if (!confirm('Delete this contact record?')) return;
    try {
        await fetch('/api/dir/log/' + id, { method: 'DELETE' });
        loadLogs();
        loadStats();
    } catch(e) {
        alert('Error deleting: ' + e.message);
    }
}

// ── Engine serial search ───────────────────────────────────────────────────
async function searchByEngine() {
    const serial = document.getElementById('searchSerial').value.trim().toUpperCase();
    if (!serial) { alert('Please enter an engine serial number.'); return; }

    const container = document.getElementById('engineSearchContainer');
    const section   = document.getElementById('engineSearchResults');
    container.innerHTML = '<div class="empty">Loading…</div>';
    section.classList.remove('hidden');

    try {
        const r = await fetch('/api/dir/engine/' + encodeURIComponent(serial));
        const d = await r.json();
        if (!d.success) { container.innerHTML = `<div class="empty">Error: ${d.error}</div>`; return; }
        if (!d.logs.length) {
            container.innerHTML = `<div class="empty">No contact records found for engine <strong>${serial}</strong>.</div>`;
            return;
        }
        const s = d.stats || {};
        container.innerHTML = `
            <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <span style="font-size:13px;font-weight:700;color:var(--ink);">${serial}</span>
                <span style="font-size:12px;color:var(--muted);">${d.logs.length} contact${d.logs.length !== 1 ? 's' : ''}</span>
            </div>
            ${d.logs.map(log => renderLogEntry(log)).join('')}
        `;
    } catch(e) {
        container.innerHTML = `<div class="empty">Network error: ${e.message}</div>`;
    }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function outcomeBadge(outcome) {
    const map = {
        engine_fault:   ['badge-engine',   '🔴 Engine Fault'],
        user_error:     ['badge-user',     '🟡 User Error'],
        mechanic_error: ['badge-mechanic', '🔵 Mechanic Error'],
        inconclusive:   ['badge-incon',    '🟣 Inconclusive'],
        no_fault:       ['badge-no',       '✅ No Fault Found'],
    };
    const [cls, label] = map[outcome] || ['','Unknown'];
    return `<span class="badge ${cls}">${label}</span>`;
}

function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── QR Camera (same logic as engine-management.html) ──────────────────────
async function openCamera(inputId) {
    currentTargetInput = inputId;
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try { await openLiveScanner(); return; } catch(err) { closeCamera(); }
    }
    openPhotoCapture(inputId);
}

async function openLiveScanner() {
    const overlay = document.getElementById('cameraOverlay');
    overlay.classList.add('active');
    scanningActive = true;
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'environment', width:{ ideal:1280 }, height:{ ideal:720 } }
    });
    cameraStream = stream;
    const div = document.querySelector('#scanner-reader');
    div.innerHTML = '';
    const video = document.createElement('video');
    video.setAttribute('playsinline','');
    video.setAttribute('autoplay','');
    video.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    div.appendChild(video);
    video.srcObject = stream;
    await video.play();
    if ('BarcodeDetector' in window) {
        const det = new BarcodeDetector({ formats:['qr_code'] });
        async function detect() {
            if (!scanningActive) return;
            try {
                const results = await det.detect(video);
                if (results.length > 0) { onQRFound(results[0].rawValue); return; }
            } catch(e) {}
            if (scanningActive) requestAnimationFrame(detect);
        }
        requestAnimationFrame(detect);
    } else {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        function liveJsQR() {
            if (!scanningActive) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const qr = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts:'attemptBoth' });
                if (qr && qr.data) { onQRFound(qr.data); return; }
            }
            if (scanningActive) requestAnimationFrame(liveJsQR);
        }
        requestAnimationFrame(liveJsQR);
    }
}

function openPhotoCapture(inputId) {
    const overlay = document.getElementById('cameraOverlay');
    overlay.classList.add('active');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.capture = 'environment';
    fileInput.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
    document.body.appendChild(fileInput);
    fileInput.onchange = (e) => {
        try { document.body.removeChild(fileInput); } catch(_) {}
        overlay.classList.remove('active');
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => decodeQRFromImage(img, url, inputId);
        img.src = url;
    };
    fileInput.oncancel = () => { try { document.body.removeChild(fileInput); } catch(_) {} overlay.classList.remove('active'); };
    fileInput.click();
}

function decodeQRFromImage(img, url, inputId) {
    if ('BarcodeDetector' in window) {
        new BarcodeDetector({ formats:['qr_code'] }).detect(img).then(results => {
            URL.revokeObjectURL(url);
            if (results.length > 0) { onQRFound(results[0].rawValue); }
            else { decodeWithJsQR(img, inputId); }
        }).catch(() => { URL.revokeObjectURL(url); decodeWithJsQR(img, inputId); });
    } else { URL.revokeObjectURL(url); decodeWithJsQR(img, inputId); }
}

function decodeWithJsQR(img, inputId) {
    const MAX = 800;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > MAX || h > MAX) { const s = MAX / Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const imgData = canvas.getContext('2d').getImageData(0, 0, w, h);
    const qr = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts:'attemptBoth' });
    if (qr && qr.data) { onQRFound(qr.data); }
    else { alert('No QR/barcode found. Try getting closer or enter manually.'); }
}

function onQRFound(value) {
    const upper = value.trim().toUpperCase();
    scanningActive = false;
    const input = document.getElementById(currentTargetInput);
    if (input) { input.value = upper; input.dispatchEvent(new Event('input', { bubbles:true })); }
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    closeCamera();

    // If scanning engine serial on the search page, auto-trigger search
    if (currentTargetInput === 'searchSerial') {
        setTimeout(() => searchByEngine(), 300);
    }
}

function closeCamera() {
    scanningActive = false;
    document.getElementById('cameraOverlay').classList.remove('active');
    if (cameraStream) { try { cameraStream.getTracks().forEach(t => t.stop()); } catch(_) {} cameraStream = null; }
    const div = document.querySelector('#scanner-reader');
    if (div) div.innerHTML = '';
    flashEnabled = false;
    document.getElementById('flashIcon').textContent = '🔦';
}

async function toggleFlash() {
    try {
        const video = document.querySelector('#scanner-reader video');
        if (!video || !video.srcObject) return;
        const track = video.srcObject.getVideoTracks()[0];
        if (!track.getCapabilities().torch) { alert('Flash not available on this device'); return; }
        flashEnabled = !flashEnabled;
        await track.applyConstraints({ advanced:[{ torch:flashEnabled }] });
        document.getElementById('flashIcon').textContent = flashEnabled ? '💡' : '🔦';
    } catch(e) {}
}

function manualEntry() {
    closeCamera();
    if (currentTargetInput) {
        const input = document.getElementById(currentTargetInput);
        if (input) input.focus();
    }
}
</script>
</body>
